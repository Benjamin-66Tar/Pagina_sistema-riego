<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor AgroMind - API Control</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .valor-actual { font-size: 2rem; color: #27ae60; margin: 10px 0; font-weight: bold; }
        .info-card { background: #eef2f3; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; color: white; }
        .bg-success { background-color: #27ae60; }
        .bg-danger { background-color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel de Control AgroMind</h1>
        
        <div class="info-card">
            <div>Estado Bomba: <span id="bomba-status" class="badge bg-danger">Cargando...</span></div>
            <div>Umbral Configurado: <span id="umbral-status" style="font-weight: bold;">--</span>%</div>
        </div>

        <div class="valor-actual">Humedad en Tiempo Real: <span id="humedad-texto">0</span>%</div>
        <canvas id="graficaHumedad" width="400" height="200"></canvas>
    </div>

    <script>
        // --- CONFIGURACIÓN DE LA DIRECCIÓN DEL HARDWARE ---
        const ESP32_IP = "111.111.111.111"; // <<--- CAMBIA ESTO POR LA IP DE TU ESP32
        
        const ctx = document.getElementById('graficaHumedad').getContext('2d');
        const maxDatos = 20; 
        
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [{
                    label: 'Humedad (%)',
                    data: [],
                    borderColor: '#27ae60',
                    backgroundColor: 'rgba(39, 174, 96, 0.1)',
                    borderWidth: 2,
                    tension: 0.3, 
                    fill: true
                }]
            },
            options: { scales: { y: { beginAtZero: true, max: 100 } } }
        });

        // 1. USO DE FETCH API: Carga los datos iniciales de configuración al abrir la página
        function cargarDatosIniciales() {
            fetch(`http://${ESP32_IP}/api/status`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error en la respuesta de la API');
                    }
                    return response.json(); // Convierte la respuesta cruda del ESP32 a un objeto JS
                })
                .then(data => {
                    // Procesamos los datos estructurados del JSON
                    document.getElementById('umbral-status').innerText = data.umbral_riego;
                    actualizarBadgeBomba(data.bomba_activa);
                    console.log("Datos iniciales recuperados con Fetch:", data);
                })
                .catch(error => {
                    console.error('Hubo un problema con la petición Fetch:', error);
                });
        }

        function actualizarBadgeBomba(activa) {
            const badge = document.getElementById('bomba-status');
            if (activa) {
                badge.innerText = "ENCENDIDA";
                badge.className = "badge bg-success";
            } else {
                badge.innerText = "APAGADA";
                badge.className = "badge bg-danger";
            }
        }

        // Ejecutar Fetch tan pronto cargue la estructura de la página
        document.addEventListener("DOMContentLoaded", cargarDatosIniciales);


        // 2. CONEXIÓN WEBSOCKET: Mantiene la gráfica fluyendo en tiempo real
        const connection = new WebSocket(`ws://${ESP32_IP}:81/`);

        connection.onmessage = function(event) {
            const porcentaje = parseInt(event.data);
            document.getElementById('humedad-texto').innerText = porcentaje;

            const tiempoActual = new Date().toLocaleTimeString();
            chart.data.labels.push(tiempoActual);
            chart.data.datasets[0].data.push(porcentaje);

            if(chart.data.labels.length > maxDatos) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update();

            // Opcional: Podrías hacer un fetch automático aquí si quieres refrescar 
            // los estados secundarios, pero con actualizar la UI es suficiente.
        };

        connection.onerror = function(error) {
            console.log('Error en WebSocket: ', error);
        };
    </script>
</body>
</html>
